    <meta charset="UTF-8" />
    <!-- Both colourways ship. Browsers that support media on an icon link get the
         inverted mark (amber tile) against dark browser chrome; the unmedia'd link
         below is the fallback and must stay last of the two SVGs. -->
    <link rel="icon" type="image/svg+xml" href="/brand/favicon-mark-inv.svg" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#F8F0E4" />
    <script src="/theme-init.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AI Sundays, a Copenhagen community where people build with AI and show what they learned." />

    <meta property="og:description" content="A Copenhagen community that meets every two weeks to build with AI, then shows the work." />
    <link rel="canonical" href="https://www.aisundays.org/" />
    <meta property="og:url" content="https://www.aisundays.org/" />
    <meta property="og:image" content="https://www.aisundays.org/brand/og.png" />
