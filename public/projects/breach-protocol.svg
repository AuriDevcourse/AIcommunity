<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" font-family="ui-monospace, 'JetBrains Mono', monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d121a"/>
      <stop offset="1" stop-color="#080b11"/>
    </linearGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#7e92a3" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="640" height="360" fill="url(#bg)"/>
  <rect width="640" height="360" fill="url(#grid)"/>

  <!-- brand -->
  <g transform="translate(40,44)">
    <g transform="translate(0,-14)">
      <circle cx="12" cy="12" r="10" fill="none" stroke="#FF5A3C" stroke-width="2.4"/>
      <path d="M12 0v6M12 18v6M0 12h6M18 12h6" stroke="#FF5A3C" stroke-width="2.4" stroke-linecap="round"/>
    </g>
    <text x="36" y="4" fill="#E7E2D8" font-size="19" font-weight="700" letter-spacing="1.5">BREACH<tspan fill="#FF5A3C">//</tspan>PROTOCOL</text>
  </g>

  <!-- the victim: a mini browser leaking a secret -->
  <g transform="translate(40,96)">
    <rect x="0" y="0" width="560" height="196" rx="12" fill="#141b25" stroke="#28323f" stroke-width="1"/>
    <!-- chrome -->
    <rect x="0" y="0" width="560" height="34" rx="12" fill="#0f151d"/>
    <rect x="0" y="22" width="560" height="12" fill="#0f151d"/>
    <circle cx="20" cy="17" r="4.5" fill="#2b3543"/><circle cx="36" cy="17" r="4.5" fill="#2b3543"/><circle cx="52" cy="17" r="4.5" fill="#2b3543"/>
    <rect x="70" y="9" width="230" height="16" rx="5" fill="#0a0e14"/>
    <text x="80" y="21" fill="#8592a3" font-size="11"><tspan fill="#35D6A0">&#9673;</tspan> vulnshop.local</text>

    <!-- light shop surface -->
    <rect x="12" y="46" width="536" height="138" rx="8" fill="#ECE8DF"/>
    <rect x="26" y="60" width="46" height="46" rx="9" fill="#d7d2fb"/>
    <text x="84" y="76" fill="#1c2028" font-size="14" font-weight="700" font-family="sans-serif">Nordic Cold Brew</text>
    <text x="84" y="94" fill="#5b6270" font-size="12">DKK 149 &#183; in stock</text>

    <!-- leaked source -->
    <rect x="26" y="116" width="496" height="54" rx="7" fill="#12161d"/>
    <text x="38" y="136" fill="#8592a3" font-size="11.5">&#60;script&#62; OPENAI_KEY: <tspan fill="#ff8a72">"sk-proj-DUMMY-a1b2c3"</tspan>,</text>
    <text x="38" y="156" fill="#8592a3" font-size="11.5">&#160;&#160;STRIPE_SECRET: <tspan fill="#ff8a72">"sk_live_51Hx9R&#8230;"</tspan> &#60;/script&#62;</text>

    <!-- breach tag -->
    <g transform="translate(392,116)">
      <rect x="0" y="-14" width="130" height="26" rx="7" fill="#FF5A3C"/>
      <text x="12" y="3" fill="#170603" font-size="10.5" font-weight="700" letter-spacing="0.4">KEY EXPOSED</text>
    </g>
  </g>

  <!-- tagline -->
  <text x="40" y="332" fill="#8592a3" font-size="12.5">learn security by breaking things</text>
</svg>
